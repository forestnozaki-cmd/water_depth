<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>水深計測</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      background: #1d4ed8;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    header h1 { font-size: 18px; font-weight: 700; }
    .version { font-size: 11px; opacity: 0.7; font-weight: 400; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
    }
    .online  { background: #10b981; }
    .offline { background: #ef4444; }
    .unknown { background: #9ca3af; }

    .container { padding: 14px; max-width: 480px; margin: 0 auto; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .card-title {
      font-size: 11px;
      color: #6b7280;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    input[type="date"],
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      color: #111827;
      background: #f9fafb;
      appearance: none;
      -webkit-appearance: none;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #1d4ed8;
      background: white;
    }

    .depth-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .depth-item { display: flex; flex-direction: column; align-items: center; }
    .depth-item label { font-size: 11px; color: #9ca3af; margin-bottom: 3px; }
    .depth-item input {
      padding: 8px 4px;
      text-align: center;
      margin-bottom: 0;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #1d4ed8; color: white; margin-bottom: 8px; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; transform: none; }
    .btn-clear { background: #f3f4f6; color: #6b7280; }

    .queue-banner {
      background: #fffbeb;
      border: 1.5px solid #fcd34d;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #92400e;
      margin-bottom: 14px;
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 999;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: #10b981; }
    .toast.error   { background: #ef4444; }
    .toast.info    { background: #3b82f6; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>💧 水深計測</h1>
    <span class="version">v1.1</span>
  </div>
  <div class="header-right">
    <span class="status-badge unknown" id="statusBadge">確認中</span>
  </div>
</header>

<div class="container">

  <div class="card">
    <div class="card-title">計測情報</div>
    <label>計測日</label>
    <input type="date" id="measureDate">
    <label>地点名</label>
    <input type="text" id="location" placeholder="例：第3水路 A断面">
    <label>備考（任意）</label>
    <input type="text" id="note" placeholder="例：増水後の計測">
  </div>

  <div class="card">
    <div class="card-title">水深（m）— 最大20点</div>
    <div class="depth-grid" id="depthGrid"></div>
  </div>

  <div class="queue-banner" id="queueBanner"></div>

  <button class="btn btn-primary" id="sendBtn" onclick="handleSend()">📡 送信する</button>
  <button class="btn btn-clear" onclick="clearForm()">クリア</button>

</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  GAS Web App URL
// ============================================================
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbxOzpJEp4UBwX0AKTBsQA0KBdMUfHG32L-XIv8Z9_ph3jJFUWigbVMCW1DgvrsDeYSa/exec';
const QUEUE_KEY = 'depth_send_queue';
// ============================================================

// 今日の日付をデフォルト
(function setToday() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById('measureDate').value =
    `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
})();

// 水深入力欄を20個生成
(function buildGrid() {
  const grid = document.getElementById('depthGrid');
  for (let i = 1; i <= 20; i++) {
    const div = document.createElement('div');
    div.className = 'depth-item';
    div.innerHTML = `
      <label>No.${i}</label>
      <input type="number" id="d${i}" placeholder="0.00"
             step="0.01" min="0" inputmode="decimal">`;
    grid.appendChild(div);
  }
})();

// ── 通信状態 ─────────────────────────────────────────────────
function updateStatus() {
  const badge = document.getElementById('statusBadge');
  if (navigator.onLine) {
    badge.textContent = '● オンライン';
    badge.className = 'status-badge online';
    trySendQueue();
  } else {
    badge.textContent = '● オフライン';
    badge.className = 'status-badge offline';
  }
  refreshQueueBanner();
}
window.addEventListener('online',  updateStatus);
window.addEventListener('offline', updateStatus);
updateStatus();

// ── キュー管理 ───────────────────────────────────────────────
function getQueue() {
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
  catch { return []; }
}
function saveQueue(q)  { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }
function enqueue(data) { const q = getQueue(); q.push(data); saveQueue(q); refreshQueueBanner(); }
function refreshQueueBanner() {
  const q  = getQueue();
  const el = document.getElementById('queueBanner');
  if (q.length > 0) {
    el.style.display = 'block';
    el.textContent = `⏳ 未送信データ ${q.length} 件 ← オンライン復帰後に自動送信`;
  } else {
    el.style.display = 'none';
  }
}

// ── データ収集 ───────────────────────────────────────────────
function collectData() {
  const date     = document.getElementById('measureDate').value;
  const location = document.getElementById('location').value.trim();
  const note     = document.getElementById('note').value.trim();

  if (!date || !location) {
    showToast('計測日と地点名を入力してください', 'error');
    return null;
  }
  const depths = [];
  for (let i = 1; i <= 20; i++) {
    const v = document.getElementById(`d${i}`).value;
    depths.push(v !== '' ? parseFloat(v) : null);
  }
  if (depths.every(v => v === null)) {
    showToast('水深を1つ以上入力してください', 'error');
    return null;
  }
  return { date, location, note, depths, savedAt: new Date().toISOString() };
}

// ── GASへ送信（no-cors で CORS 問題を根本回避）───────────────
async function postToGAS(data) {
  // mode:'no-cors' = CORSエラーが出ない / GASには確実に届く
  // 応答は読めないが、スプレッドシートへの書き込みは実行される
  await fetch(GAS_URL, {
    method:  'POST',
    mode:    'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body:    JSON.stringify(data)
  });
  // fetchが例外を投げなければ送信成功とみなす
}

// ── 送信ボタン ───────────────────────────────────────────────
async function handleSend() {
  const data = collectData();
  if (!data) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = '送信中…';

  if (!navigator.onLine) {
    enqueue(data);
    showToast('オフライン：データを保存しました', 'info');
    btn.disabled = false;
    btn.textContent = '📡 送信する';
    clearForm();
    return;
  }

  try {
    await postToGAS(data);
    showToast('✅ 送信完了！', 'success');
    clearForm();
  } catch {
    enqueue(data);
    showToast('送信失敗：データを保存しました', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '📡 送信する';
  }
}

// ── キューの再送 ─────────────────────────────────────────────
async function trySendQueue() {
  const q = getQueue();
  if (q.length === 0) return;
  const remaining = [];
  for (const data of q) {
    try { await postToGAS(data); }
    catch { remaining.push(data); }
  }
  saveQueue(remaining);
  const sent = q.length - remaining.length;
  if (sent > 0) showToast(`✅ 未送信 ${sent} 件を送信しました`, 'success');
  refreshQueueBanner();
}

// ── フォームクリア ───────────────────────────────────────────
function clearForm() {
  document.getElementById('location').value = '';
  document.getElementById('note').value = '';
  for (let i = 1; i <= 20; i++) document.getElementById(`d${i}`).value = '';
}

// ── トースト ─────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = `toast ${type}`; }, 3500);
}
</script>
</body>
</html>
